# This is a basic workflow to help you get started with Actions

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova & Create App
        run: |
          npm install -g cordova
          cordova create myApp com.turkcepro.app TurkcePro
          
          # نسخ ملف HTML إلى مجلد التطبيق
          cp index.html myApp/www/index.html

      - name: Build Android APK
        run: |
          cd myApp
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurkcePro-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
